<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather and Alerts Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; background: #fafafa; color: #1f2933; }
    header, main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 0; }
    h1 { margin: 0; font-size: 1.75rem; }
    .tag { margin: .25rem 0 0; color: #52606d; }
    .start { border: 1px solid #cbd2d9; border-radius: 6px; padding: 1rem 1.25rem; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Weather and Alerts Dashboard</h1>
    <p class="tag">Turn forecast data into clear warnings.</p>
  </header>
  <main id="app">
    <div class="start">
      <p id="status">Starting...</p>
      <p>Replace this with your UI. The core tasks are listed in README.md.</p>
    </div>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
